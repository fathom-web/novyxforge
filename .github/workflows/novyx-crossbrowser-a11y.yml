name: NOVYX 3.0 Cross-browser + Accessibility

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.json'
      - 'tests/v3-crossbrowser-a11y.mjs'
      - '.github/workflows/novyx-crossbrowser-a11y.yml'
  pull_request:
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.json'
      - 'tests/v3-crossbrowser-a11y.mjs'
      - '.github/workflows/novyx-crossbrowser-a11y.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-browser-a11y:
    name: Chromium, Firefox, Safari/WebKit + WCAG checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out NOVYX
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browsers and accessibility audit
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium firefox webkit
      - name: Validate seven project worlds on desktop and mobile
        run: node tests/v3-crossbrowser-a11y.mjs
      - name: Preserve verified NOVYX concept/demo renders and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novyx-v3-crossbrowser-design-review
          path: qa-world-visuals/
          if-no-files-found: warn
          retention-days: 14
